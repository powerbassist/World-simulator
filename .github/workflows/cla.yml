# The contributor licence agreement gate (CLA.md). A contributor signs once by
# commenting the sentence below on a pull request; the signature is stored on the
# cla-signatures branch.
#
# This is the repo's one pull_request_target workflow, and it is safe for the
# reason that trigger usually is not: it never checks out or runs the pull
# request's code -- the pinned action reads comments and writes one JSON file.
# Do not add a checkout of the PR head here.
#
# `claude` is on the allowlist because the author's own commits carry a
# Co-Authored-By trailer for the AI assistant, which GitHub maps to that account.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: powerbassist,claude,dependabot[bot],github-actions[bot]
