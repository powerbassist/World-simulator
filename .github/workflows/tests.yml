# The repo's gate on GitHub: the same commands AGENTS.md names, from a FRESH CLONE.
#
# A fresh clone is the point, not a side effect. AGENTS.md records two failures
# that only a clone without .godot/ could show (the MCPRuntimeServer autoload
# creeping into the committed project.godot; dialogue_manager's class_name types
# unresolvable without the class cache) -- a local machine always runs warm and
# never sees either. tools/run_tests.sh does its own one-time --headless --import
# when .godot/ is absent, so this job adds nothing to the suite's own logic.
#
# Not here: tools/check_mcp.sh (it needs a running editor and the per-machine
# godot_mcp_toolkit addon, neither of which a clone has) and the windowed
# tools/screenshot.gd frames (--headless draws nothing).

name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like project.godot's config/features: bump deliberately, with the repo.
  GODOT_VERSION: "4.7.1"

jobs:
  suite:
    # Plain text: a job name cannot read the env context (a workflow-file error, 0s run).
    name: Headless suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Godot
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"
          mkdir -p "$HOME/.local/bin"
          ln -s "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Godot version
        run: godot --headless --version

      - name: Run the suite
        run: bash tools/run_tests.sh

      - name: Keep the per-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-runs
          path: reports/suite_runs/
          if-no-files-found: ignore

  checks:
    name: Names and vault
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Banned names
        run: bash tools/check_names.sh
      - name: Vault links
        run: python tools/check_vault.py
