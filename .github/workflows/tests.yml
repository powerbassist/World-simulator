# The repo's gate on GitHub: the same commands AGENTS.md names, from a FRESH CLONE.
#
# A fresh clone is the point, not a side effect. AGENTS.md records two failures
# that only a clone without .godot/ could show (the MCPRuntimeServer autoload
# creeping into the committed project.godot; dialogue_manager's class_name types
# unresolvable without the class cache) -- a local machine always runs warm and
# never sees either. tools/run_tests.sh does its own one-time --headless --import
# when .godot/ is absent, so this job adds nothing to the suite's own logic. The
# Godot binary is cached; .godot/ never is, or the fresh-clone gate is gone.
#
# The suite is split over 4 runners (tools/ci_shards.json, balanced by measured
# duration): a private repo's runner has 2 cores, and the whole suite on one ran
# 25.5 min. Branch protection should require the one "tests" job at the bottom,
# not each shard, so the shard count can change without touching the rule.
#
# Not here: tools/check_mcp.sh (it needs a running editor and the per-machine
# godot_mcp_toolkit addon, neither of which a clone has) and the windowed
# tools/screenshot.gd frames (--headless draws nothing).

name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Public repo: a fork's pull request runs this workflow, so the token can read
# and nothing else, every action is pinned to a commit (a moved tag cannot swap
# the code under us), and there is no pull_request_target anywhere in it.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like project.godot's config/features: bump deliberately, with the repo.
  GODOT_VERSION: "4.7.2"

jobs:
  suite:
    # Plain text: a job name cannot read the env context (a workflow-file error, 0s run).
    name: Suite shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Must match the shard count in tools/ci_shards.json; a shard out of
        # range fails loud in ci_shards.py, a missing one fails the "Names,
        # vault and shards" job's count check.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"

      - name: Put Godot on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Godot version
        run: godot --headless --version

      - name: Run the shard
        run: bash tools/run_tests.sh
        env:
          SUITE_SHARD: ${{ matrix.shard }}

      # Always, not only on failure: the per-test durations in events.ndjson are
      # what `tools/ci_shards.py --rebalance` re-splits the suite from.
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: suite-runs-shard-${{ matrix.shard }}
          path: reports/suite_runs/
          if-no-files-found: ignore

  checks:
    name: Names, vault, licences and shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Banned names
        run: bash tools/check_names.sh
      - name: Vault links
        run: python tools/check_vault.py
      - name: Size ratchet (code lines; tools/size_baseline.json)
        run: python tools/check_size.py
      - name: Translation tables (stale keys, empty values, placeholders)
        run: |
          python tools/i18n_extract.py --selftest
          python tools/i18n_extract.py --check
      - name: Every file has a declared licence (REUSE)
        run: |
          pip install --quiet reuse==6.2.0
          reuse lint
      - name: Every registered test is in exactly one shard
        run: bash tools/run_tests.sh --print-tests | python tools/ci_shards.py --check
      - name: The matrix runs every shard
        run: |
          n=$(python -c "import json; print(len(json.load(open('tools/ci_shards.json'))['shards']))")
          grep -q "shard: \[$(seq -s ', ' 1 "$n")\]" .github/workflows/tests.yml \
            || { echo "tools/ci_shards.json has $n shards; the suite matrix must list 1..$n"; exit 1; }

  # The one check to require on main: green only when every shard and the checks
  # are green (a skipped or cancelled shard is not a pass).
  tests:
    name: tests
    if: always()
    needs: [suite, checks]
    runs-on: ubuntu-latest
    steps:
      - name: All shards and checks passed
        run: |
          [ "${{ needs.suite.result }}" = "success" ] && [ "${{ needs.checks.result }}" = "success" ] \
            || { echo "suite=${{ needs.suite.result }} checks=${{ needs.checks.result }}"; exit 1; }
