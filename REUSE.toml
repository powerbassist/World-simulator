# Which licence covers which file -- the REUSE spec (https://reuse.software),
# checked by `reuse lint` in CI. Later annotations override earlier ones, so the
# general rules come first and the exceptions after them.
version = 1

[[annotations]]
# Default: code, tools, tests, project files.
path = [
  "**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 powerbassist"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"

[[annotations]]
# Game content, the design vault, and the art generated from text alone (local ComfyUI). Upstream data credited in ATTRIBUTION.md.
path = [
  "data/**",
  "docs/**",
  "*.md",
  ".obsidian/*.json",
  "assets/portraits/**",
  "assets/portrait_scenes/**",
  "assets/event_art/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 powerbassist"
SPDX-License-Identifier = "CC-BY-NC-4.0"

